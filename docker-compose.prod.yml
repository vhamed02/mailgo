services:
  postgres:
    image: postgres:16-alpine
    container_name: mailgo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mailgo
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mailgo-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mailgo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - mailgo-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  control-plane:
    image: ${REGISTRY:-ghcr.io}/mailgo-api:latest
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.api
    container_name: mailgo-api
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/mailgo?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mailgo-internal
      - mailgo-public
    volumes:
      - ./backend/migrations:/app/migrations:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    image: ${REGISTRY:-ghcr.io}/mailgo-worker:latest
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.worker
    container_name: mailgo-worker
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/mailgo?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mailgo-internal
      - mailgo-public
    healthcheck:
      test: ["CMD", "pgrep", "-f", "worker"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ${REGISTRY:-ghcr.io}/mailgo-frontend:latest
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: mailgo-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://mail.tracix.net/api/v1
      NODE_ENV: production
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - control-plane
    networks:
      - mailgo-public
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  mailgo-internal:
    driver: bridge
    internal: true
  mailgo-public:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
